name: Codex leap-boundary native validation
on:
  push:
    branches: [codex/validate-leap-boundaries]
permissions:
  contents: read
jobs:
  red-green-and-owner-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_NO_CACHE: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DAGSTER_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peterolkhov/dagster
          ref: a73a20738f880f70d0f4fb180d96f30953516239
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
      - name: Install complete source and native test closure
        run: |
          uv --version
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e python_modules/dagster-pipes -e python_modules/libraries/dagster-shared -e 'python_modules/dagster[test]' -e python_modules/dagster-test -e python_modules/libraries/create-dagster -e python_modules/libraries/dagster-dg-core -e python_modules/libraries/dagster-cloud-cli ruff==0.17.2 ty==0.0.91 rust-just==1.59.0
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip freeze --python .venv/bin/python
      - name: Mandatory repository formatter and lint
        run: |
          just ruff
          just check_ruff
      - name: Preserve exact validated candidate bytes
        run: |
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          approved=["python_modules/dagster/dagster/_utils/schedules.py","python_modules/dagster/dagster_tests/scheduler_tests/test_cron_string_iterator.py","python_modules/dagster/dagster_tests/scheduler_tests/test_schedule_iterator.py","python_modules/dagster/dagster_tests/definitions_tests/test_time_window_partitions.py"]
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert set(changed)<=set(approved),("Formatter touched unreviewed paths",changed)
          for name in approved:
           data=Path(name).read_bytes()
           print("VALIDATED_FILE_JSON="+json.dumps(dict(path=name,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data))),flush=True)
           if name in changed:
            encoded=base64.b64encode(data).decode()
            chunks=[encoded[i:i+24000] for i in range(0,len(encoded),24000)]
            for i,chunk in enumerate(chunks):
             print("FORMATTED_BLOB_JSON="+json.dumps(dict(path=name,index=i,total=len(chunks),contents=chunk)),flush=True)
          PY

      - name: Prove new native regressions fail on original owner
        run: |
          cp python_modules/dagster/dagster/_utils/schedules.py /tmp/dagster-reviewed-fixed-source.py
          git show 93e5f51da49420d3e06d9399471070acedb554ca:python_modules/dagster/dagster/_utils/schedules.py > python_modules/dagster/dagster/_utils/schedules.py
          set +e
          python -m pytest -q python_modules/dagster/dagster_tests/scheduler_tests/test_cron_string_iterator.py python_modules/dagster/dagster_tests/scheduler_tests/test_schedule_iterator.py python_modules/dagster/dagster_tests/definitions_tests/test_time_window_partitions.py -k 'test_cron_iterator_leap_day_boundaries or test_cron_iterator_leap_day_centuries or test_union_with_leap_day_schedule or test_leap_day_partition_key_for_timestamp' --tb=short --junitxml=/tmp/dagster-red.xml
          red_status=$?
          set -e
          cp /tmp/dagster-reviewed-fixed-source.py python_modules/dagster/dagster/_utils/schedules.py
          test "$red_status" -eq 1
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          root=ET.parse("/tmp/dagster-red.xml").getroot()
          suites=list(root.iter("testsuite"))
          summary={k:sum(int(s.get(k,0)) for s in suites) for k in ["tests","failures","errors","skipped"]}
          failures=[dict(name=c.get("name"),message=(c.find("failure").text or "")[:2500]) for c in root.iter("testcase") if c.find("failure") is not None]
          print("RED_RESULT_JSON="+json.dumps(dict(summary=summary,examples=failures[:5])),flush=True)
          assert summary["tests"]==62 and summary["errors"]==0 and summary["failures"]>0
          PY

      - name: Full affected native owner suites on repaired source
        run: python -m pytest -q python_modules/dagster/dagster_tests/scheduler_tests/test_cron_string_iterator.py python_modules/dagster/dagster_tests/scheduler_tests/test_schedule_iterator.py python_modules/dagster/dagster_tests/definitions_tests/test_time_window_partitions.py --tb=short --junitxml=/tmp/dagster-green.xml
      - name: Independent public consumer after replay
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import json, platform, subprocess, sys
          from datetime import datetime
          from itertools import islice
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import dagster, dagster_shared, dagster_pipes
          from dagster import Definitions, ScheduleDefinition, TimeWindowPartitionsDefinition, job, op
          from dagster._core.remote_origin import RegisteredCodeLocationOrigin
          from dagster._core.remote_representation.external import RemoteSchedule
          from dagster._core.remote_representation.external_data import ScheduleSnap
          from dagster._core.remote_representation.handle import RepositoryHandle
          
          PIN = "a73a20738f880f70d0f4fb180d96f30953516239"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD") == PIN
          assert git("diff", "--name-only", "--", "python_modules/dagster/dagster") == ""
          root = Path.cwd().resolve()
          paths = {m.__name__: str(Path(m.__file__).resolve()) for m in (dagster, dagster_shared, dagster_pipes)}
          assert all(root in Path(p).parents for p in paths.values())
          
          @op
          def diagnostic_input():
              return 1
          
          @job
          def diagnostic_job():
              diagnostic_input()
          
          def schedule(cron, tz):
              definition = ScheduleDefinition(job=diagnostic_job, cron_schedule=cron, execution_timezone=tz)
              repository = Definitions(jobs=[diagnostic_job], schedules=[definition]).get_repository_def()
              handle = RepositoryHandle(repository_name=repository.name, code_location_origin=RegisteredCodeLocationOrigin("diagnostic_only"), repository_python_origin=None, display_metadata={})
              return RemoteSchedule(ScheduleSnap.from_def(definition, repository), handle)
          
          rows = []
          def record(surface, label, tz, actual, correct, before):
              def norm(values):
                  return [v.isoformat() if isinstance(v, datetime) else v for v in values]
              actual, correct, before = map(norm, (actual, correct, before))
              rows.append(dict(surface=surface, label=label, timezone=tz, actual=actual, correct_contract=correct, expected_before=before, known_bug_case=before != correct, baseline_expectation_met=actual == correct, product_contract_met=actual == correct))
          
          for tz in ("UTC", "Europe/Berlin"):
              zone = ZoneInfo(tz)
              def dt(y, m, d, h=0, minute=0, second=0):
                  return datetime(y, m, d, h, minute, second, tzinfo=zone)
              leap = schedule("0 0 29 2 *", tz)
              cases = [
                  ("before-surrogate", dt(2028,2,27,12), dt(2028,2,29), dt(2024,2,29), dt(2028,2,29), dt(2024,2,29)),
                  ("surrogate-exact", dt(2028,2,28), dt(2028,2,29), dt(2024,2,29), dt(2028,2,29), dt(2028,2,29)),
                  ("day-before-noon", dt(2028,2,28,12), dt(2028,2,29), dt(2024,2,29), dt(2032,2,29), dt(2028,2,29)),
                  ("second-before", dt(2028,2,28,23,59,59), dt(2028,2,29), dt(2024,2,29), dt(2032,2,29), dt(2028,2,29)),
                  ("tick-exact-inclusive", dt(2028,2,29), dt(2028,2,29), dt(2028,2,29), dt(2032,2,29), dt(2028,2,29)),
                  ("second-after", dt(2028,2,29,0,0,1), dt(2032,2,29), dt(2028,2,29), dt(2032,2,29), dt(2028,2,29)),
                  ("nonleap-control", dt(2027,2,28,12), dt(2028,2,29), dt(2024,2,29), dt(2028,2,29), dt(2024,2,29)),
              ]
              for label, query, forward, reverse, bf, br in cases:
                  for ascending, correct, before in ((True,forward,bf),(False,reverse,br)):
                      actual = next(leap.execution_time_iterator(query.timestamp(), ascending=ascending))
                      record("RemoteSchedule", label + (" forward" if ascending else " reverse"), tz, [actual], [correct], [before])
              query = dt(2028,2,28,12)
              union = schedule(["0 0 29 2 *", "0 0 1 3 *"], tz)
              for ascending, correct, before in (
                  (True, [dt(2028,2,29),dt(2028,3,1),dt(2029,3,1)], [dt(2028,3,1),dt(2029,3,1),dt(2030,3,1)]),
                  (False, [dt(2027,3,1),dt(2026,3,1),dt(2025,3,1)], [dt(2028,2,29),dt(2027,3,1),dt(2026,3,1)]),
              ):
                  actual = list(islice(union.execution_time_iterator(query.timestamp(), ascending=ascending), 3))
                  record("RemoteSchedule", "union forward" if ascending else "union reverse", tz, actual, correct, before)
              ordinary = schedule("0 0 28 2 *", tz)
              for ascending, expected in ((True,dt(2029,2,28)),(False,dt(2028,2,28))):
                  actual = next(ordinary.execution_time_iterator(query.timestamp(), ascending=ascending))
                  record("RemoteSchedule", "ordinary forward" if ascending else "ordinary reverse", tz, [actual], [expected], [expected])
              partitions = TimeWindowPartitionsDefinition(start="2020-02-29", fmt="%Y-%m-%d", cron_schedule="0 0 29 2 *", timezone=tz)
              for label, query, end_closed, correct, before in (
                  ("before-surrogate",dt(2028,2,27,12),False,"2024-02-29","2024-02-29"),
                  ("day-before-noon",dt(2028,2,28,12),False,"2024-02-29","2028-02-29"),
                  ("tick-exact",dt(2028,2,29),False,"2028-02-29","2028-02-29"),
                  ("second-after",dt(2028,2,29,0,0,1),False,"2028-02-29","2028-02-29"),
                  ("nonleap",dt(2027,2,28,12),False,"2024-02-29","2024-02-29"),
                  ("end-closed-exact",dt(2028,2,29),True,"2024-02-29","2024-02-29"),
                  ("end-closed-day-before",dt(2028,2,28,12),True,"2024-02-29","2028-02-29"),
              ):
                  actual = partitions.get_partition_key_for_timestamp(query.timestamp(), end_closed=end_closed)
                  record("TimeWindowPartitionsDefinition", label, tz, [actual], [correct], [before])
          report = dict(purpose="AFTER actual public consumer verification", source_head=git("rev-parse","HEAD"), source_tree=git("rev-parse","HEAD^{tree}"), module_paths=paths, python=sys.version, platform=platform.platform(), distributions=sorted(f"{d.metadata['Name']}=={d.version}" for d in md.distributions()), cases=len(rows), known_bug_cases=sum(r["known_bug_case"] for r in rows), unexpected=sum(not r["baseline_expectation_met"] for r in rows), observations=rows)
          print("DIAGNOSTIC_JSON=" + json.dumps(report, sort_keys=True), flush=True)
          assert report["unexpected"] == 0 and all(r["product_contract_met"] for r in rows), "Public consumer contract still fails"
          PY

      - name: Final lint and diff integrity
        run: |
          just check_ruff
          git diff --check
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          approved=["python_modules/dagster/dagster/_utils/schedules.py","python_modules/dagster/dagster_tests/scheduler_tests/test_cron_string_iterator.py","python_modules/dagster/dagster_tests/scheduler_tests/test_schedule_iterator.py","python_modules/dagster/dagster_tests/definitions_tests/test_time_window_partitions.py"]
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert set(changed)<=set(approved),("Formatter touched unreviewed paths",changed)
          for name in approved:
           data=Path(name).read_bytes()
           print("VALIDATED_FILE_JSON="+json.dumps(dict(path=name,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data))),flush=True)
           if name in changed:
            encoded=base64.b64encode(data).decode()
            chunks=[encoded[i:i+24000] for i in range(0,len(encoded),24000)]
            for i,chunk in enumerate(chunks):
             print("FORMATTED_BLOB_JSON="+json.dumps(dict(path=name,index=i,total=len(chunks),contents=chunk)),flush=True)
          PY

